<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Gabe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/gaben.jpg">
</head>
<body>
  <header><h1>Gabe</h1></header>

  <main>
    <div id="stageWrap">
      <canvas id="stage" width="512" height="512"></canvas>
      <div id="prog" hidden><div id="progFill"></div></div>
    </div>
    <div id="strip" aria-label="samples"></div>
    <div id="toolbar">
      <select id="resSel" title="Grid resolution">
        <option value="64">64</option>
        <option value="96">96</option>
        <option value="128" selected>128</option>
        <option value="160">160</option>
      </select>
      <label id="proxWrap" title="0 = maximum Gabe, 100 = pixels barely leave home">
        proximity <input type="range" id="proxSlider" min="0" max="100" value="15">
        <output id="proxOut">15</output>
      </label>
      <button id="playBtn" disabled>play</button>
      <label class="chk" title="Play the morph backward">
        <input type="checkbox" id="reverseChk"> reverse
      </label>
      <label class="chk" title="Play every sample in a loop">
        <input type="checkbox" id="autoChk" checked> auto
      </label>
      <button id="pngBtn" disabled>png</button>
      <button id="vidBtn" disabled>video</button>
    </div>
    <div id="stats"></div>
  </main>

  <footer>
    <p>Fan parody, not affiliated with Valve · after
      <a href="https://github.com/Spu7Nix/obamify" target="_blank" rel="noopener">obamify</a> by Spu7Nix</p>
  </footer>

  <script src="assets/gaben.js"></script>
  <script src="worker.js"></script>
  <script src="app.js"></script>
</body>
</html>
